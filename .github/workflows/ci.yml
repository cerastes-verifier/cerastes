# scripts/ci.sh (runner setup: asserts the toolchain, installs what is missing, bootstraps)
# and then scripts/check.sh (build, lint, self-tests, tests, mutation validation, docs).
# Two tiers (decision 0016 item 14): pull requests and pushes to main run the PR tier
# (CERASTES_CHECK_BASE is the commit they are compared with: Silicon runs only for the
# tests changed since it, the doc examples and a fixed sample, and every other run); the
# nightly schedule and workflow_dispatch run the full check (CERASTES_CHECK_BASE empty).
# Decision record: internal/decisions/0016-ci.md.
#
# The toolchains are the profiles of scripts/ci_toolchains.toml (decision 0053): the first
# job, `profiles`, asks scripts/ci_profile.py which ones this event runs, and `check` (macOS,
# set up by scripts/ci.sh) and `check-linux` (decision 0031, scripts/ci-linux.sh) run one
# job per profile.  Pull requests and pushes run the two references (macos-27 on xcode-27,
# ubuntu-26.04), the nightly run adds the `nightly` profiles, and a dispatch runs those or
# the profiles its `profiles` input names (`all` for every one).  Each setup script asserts
# the majors its profile declares and records the exact builds; every test must give the
# same outcome on every toolchain, or carry a named exclusion of that profile.
# Docs publishing stays in docs.yml.
#
# Actions are pinned to full commit SHAs (the comment gives the release);
# change them deliberately, never through a moving tag.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profiles:
        description: 'Toolchain profiles (scripts/ci_toolchains.toml): empty for the nightly set, all, or names'
        required: false
        default: ''
        type: string
  # 06:00 UTC every night, on main, whether or not main changed: image drift and
  # intermittent results show up without a commit
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

# Pull requests cancel their own superseded runs.  Every run on main finishes: its
# group is unique per run (one shared group would still drop an older pending run, and
# a push to main is a result the owner wants whole).  Dispatches on other refs have a
# group per ref: a running dispatch is never cancelled, but a newer one replaces a
# pending one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || (github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id)) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which profiles this event runs (decision 0053 item 5): two JSON lists, one per platform.
  # The dispatch input reaches the script through the environment, never the command line.
  profiles:
    name: profiles
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      macos: ${{ steps.select.outputs.macos }}
      linux: ${{ steps.select.outputs.linux }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the toolchains
        id: select
        env:
          CERASTES_CI_EVENT: ${{ github.event_name }}
          CERASTES_CI_SELECT: ${{ inputs.profiles }}
        run: python3 -I scripts/ci_profile.py matrix --event "$CERASTES_CI_EVENT" --select "$CERASTES_CI_SELECT" >> "$GITHUB_OUTPUT"

  check:
    name: check (${{ matrix.profile }})
    needs: profiles
    if: ${{ needs.profiles.outputs.macos != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.profiles.outputs.macos) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      DEVELOPER_DIR: /Library/Developer/CommandLineTools
      CERASTES_CI_PROFILE: ${{ matrix.profile }}
      CERASTES_JOBS: ${{ matrix.jobs }}
      CERASTES_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
    steps:
      # Full history, with every remote branch of the submodules: edg_tree.py needs
      # origin/cerastes of third_party/edg and the pin's ancestry in it (decision 0009).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: doc/.node-version
          cache: npm
          cache-dependency-path: doc/package-lock.json
      # bootstrap.sh skips `sbt assembly` when build/silicon.stamp records the silicon and
      # silver heads, a clean tree and the JDK formula (JDK_FORMULA in scripts/bootstrap.sh)
      # and the jar exists.  The key carries the two heads and a hash of bootstrap.sh, so
      # any change to bootstrap.sh is a (conservative) cache miss.
      - name: Silicon cache key
        id: silicon-key
        run: |
          silicon_head="$(git rev-parse HEAD:third_party/silicon)"
          silver_head="$(git -C third_party/silicon rev-parse HEAD:silver)"
          echo "key=silicon-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-${silicon_head}-${silver_head}-${{ hashFiles('scripts/bootstrap.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the Silicon build
        id: silicon-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/silicon/target/scala-2.13/silicon.jar
            build/silicon.stamp
          key: ${{ steps.silicon-key.outputs.key }}
      - name: Set up the toolchain
        run: scripts/ci.sh "$CERASTES_CI_PROFILE"
      - name: Save the Silicon build
        if: steps.silicon-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/silicon/target/scala-2.13/silicon.jar
            build/silicon.stamp
          key: ${{ steps.silicon-key.outputs.key }}
      - name: Check everything
        run: scripts/check.sh
      # always(): a job that hits timeout-minutes counts as cancelled, and its evidence
      # (the build logs above all) is what a timeout needs.
      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/vpr
            build/env.sh
            build/ci-toolchain.txt
            build/*.log
          if-no-files-found: warn
          retention-days: 14

  check-linux:
    name: check (${{ matrix.profile }})
    needs: profiles
    if: ${{ needs.profiles.outputs.linux != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.profiles.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CERASTES_CI_PROFILE: ${{ matrix.profile }}
      CERASTES_JOBS: ${{ matrix.jobs }}
      CERASTES_CHECK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      # No setup-python here: on Linux it exports LD_LIBRARY_PATH, which ci-linux.sh refuses
      # (decision 0031 item 2); the image's own Python 3.14 is the one the rehearsal used.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: doc/.node-version
          cache: npm
          cache-dependency-path: doc/package-lock.json
      - name: Silicon cache key
        id: silicon-key
        run: |
          silicon_head="$(git rev-parse HEAD:third_party/silicon)"
          silver_head="$(git -C third_party/silicon rev-parse HEAD:silver)"
          echo "key=silicon-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.profile }}-${silicon_head}-${silver_head}-${{ hashFiles('scripts/bootstrap.sh') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the Silicon build
        id: silicon-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/silicon/target/scala-2.13/silicon.jar
            build/silicon.stamp
          key: ${{ steps.silicon-key.outputs.key }}
      - name: Set up the toolchain
        run: scripts/ci-linux.sh "$CERASTES_CI_PROFILE"
      - name: Save the Silicon build
        if: steps.silicon-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            third_party/silicon/target/scala-2.13/silicon.jar
            build/silicon.stamp
          key: ${{ steps.silicon-key.outputs.key }}
      - name: Check everything
        run: scripts/check.sh
      - name: Upload the evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/vpr
            build/env.sh
            build/ci-toolchain.txt
            build/*.log
          if-no-files-found: warn
          retention-days: 14
